# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - osirisproyect

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # Nos movemos a la carpeta Code, instalamos dependencias y compilamos el proyecto
      # Esto creará la carpeta /Code/dist con tu app web lista
      - name: Install dependencies and build
        env:
          VITE_SUPABASE_URL: "https://qubwcwrzpxeygdogadkt.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1Yndjd3J6cHhleWdkb2dhZGt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyOTAzNDMsImV4cCI6MjA5NDg2NjM0M30.2Gu39d_3pjzziwrSW1j84K1u9SK-l645P-8SYHCxs24"
        run: |
          cd Code
          npm ci
          npm run build

      # Subimos como artefacto únicamente el resultado de la compilación (la carpeta dist)
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./Code/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # Al descargar el artefacto, los archivos de 'dist' se colocarán en la raíz del entorno de ejecución
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      # Verificamos qué archivos se descargaron para asegurar que todo va bien
      - name: List files
        run: ls -R
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_90F2855AA6B849CBB4CF2B997266B577 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_08F1357CC63D4A0CB50061B1AB460D76 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2841341B3ABF4D0C81A543052994E8A5 }}

      # Como el artefacto 'node-app' descargó el contenido de 'dist' directamente en la raíz, 
      # el paquete a desplegar ahora es la raíz misma ( . )
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'osirisproyect'
          slot-name: 'Production'
          package: .